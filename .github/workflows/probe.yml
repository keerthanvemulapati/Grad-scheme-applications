name: Probe job boards

# Detects which job-board platform each careers page uses. Run it by hand from
# the Actions tab when adding companies; results appear in the run summary.
on:
  workflow_dispatch:
  push:
    paths:
      - "tracker/probe.py"
      - ".github/workflows/probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tracker probe
