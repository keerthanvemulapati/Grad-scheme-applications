name: Debug job boards (temporary)
on:
  push:
    paths: ["tools/debug_boards.py", ".github/workflows/debug.yml"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/debug_boards.py
