name: Debug job boards (temporary)
on:
  push:
    paths: ["tools/debug_boards.py", ".github/workflows/debug.yml", "tracker/sources/**"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/debug_boards.py
      - run: python -m tracker diagnose --limit 3 --only medpace,abbvie,ucb,eli-lilly,takeda,bayer,astrazeneca,msd,daiichi-sankyo,mac-clinical-research,psi-cro
