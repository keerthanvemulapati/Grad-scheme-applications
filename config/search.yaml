# What counts as a relevant role. All patterns are Python regular expressions,
# matched case-insensitively against the job title unless wrapped in (?-i:...).

# The intake year you are applying for. Titles that mention an earlier year
# only (e.g. "Graduate Programme 2026") are hidden by default as old intakes.
target_intake_year: 2027

locations:
  # Country names used for the job boards' own country filters.
  countries: ["United Kingdom"]
  # Text that definitely means the UK.
  match:
    - 'united kingdom'
    - '(?-i:\bUK\b)'
    - '(?-i:\bGBR?\b)'
    - 'great britain'
    - '(?<!new )\bengland\b'
    - '\bscotland\b'
    - 'northern ireland'
  # UK towns and cities. Only trusted when nothing in the same location points
  # to another country (so "Cambridge, MA" and "Bristol TN" don't count).
  places:
    - '\bwales\b'
    - '\b(?:london|cambridge|stevenage|macclesfield|maidenhead|uxbridge|slough|high wycombe|welwyn|hatfield|harlow|oxford(?:shire)?|abingdon|milton park|didcot|harwell|milton keynes)\b'
    - '\b(?:manchester|edinburgh|glasgow|nottingham|leeds|liverpool|speke|sandwich|hertfordshire|surrey|berkshire|buckinghamshire|weybridge|brentford|hammersmith|elstree|bracknell|marlow|woking|crawley|guildford|basingstoke|luton|livingston|dundee|cardiff|belfast|leatherhead|sunbury|chertsey|camberley|cheshire|alderley|stockley park|hayes|feltham|hounslow|egham|staines|watford|hemel hempstead|chester|loughborough|barnard castle|ulverston|irvine|montrose|wrexham|deeside|bristol|southampton|sheffield|norwich|exeter|coventry|leicester|reading|ware|harrogate|huntingdon|pirbright|addlestone|gatwick|paddington|bellshill|moreton|walton oaks)\b'
  # Text that means somewhere else. Checked before the town list.
  elsewhere:
    - 'united states|\bamerica\b|(?-i:\b(?:US|USA|U\.S\.)\b)'
    - '\b(?:alabama|alaska|arizona|arkansas|california|colorado|connecticut|delaware|florida|hawaii|idaho|illinois|indiana|iowa|kansas|kentucky|louisiana|maryland|massachusetts|michigan|minnesota|mississippi|missouri|montana|nebraska|nevada|new hampshire|new jersey|new mexico|new york|north carolina|north dakota|ohio|oklahoma|oregon|pennsylvania|rhode island|south carolina|south dakota|tennessee|texas|utah|vermont|virginia|wisconsin|wyoming|puerto rico)\b'
    - '(?-i:(?:^|[\s,(/-])(?:AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|ON|QC|BC|NSW|VIC|QLD)(?=\s*(?:[,;)/]|-\s|\d{5}|$)))'
    - '\b(?:canada|ontario|quebec|british columbia|alberta|australia|new south wales|victoria, australia|queensland|new zealand|mexico|brazil|argentina|chile|colombia|peru)\b'
    - '(?<!northern )\bireland\b'
    - '\b(?:france|germany|deutschland|spain|italy|portugal|netherlands|belgium|switzerland|austria|poland|czech|hungary|romania|bulgaria|greece|turkey|t\u00fcrkiye|denmark|sweden|norway|finland|iceland|estonia|latvia|lithuania|slovakia|slovenia|croatia|serbia|ukraine|russia|israel|egypt|south africa|nigeria|kenya|morocco|saudi|emirates|uae|qatar|india|china|japan|korea|singapore|malaysia|thailand|vietnam|philippines|indonesia|taiwan|hong kong)\b'
    - '(?-i:\b(?:AUS|CAN|DEU|FRA|ESP|ITA|NLD|BEL|CHE|AUT|POL|IRL|IND|CHN|JPN|KOR|SGP|BRA|MEX|PRT|SWE|DNK|NOR|FIN|CZE|HUN|ROU|GRC|TUR|ISR|ZAF)\b)'
  # Text that doesn't tell us either way.
  ambiguous:
    - '\d+\s+locations'
    - 'multiple locations'
    - '\bremote\b'
    - '\beurope\b'
    - '\bemea\b'
    - '\bhome[- ]based\b'
    - '\bfield\b'
    - '^\s*$'

# Job areas. Priority areas are shown first and trigger alerts.
categories:
  - key: regulatory_affairs
    label: Regulatory Affairs
    priority: true
    patterns:
      - 'regulatory'
      - '\breg\.?\s*affairs'
      - '\blabell?ing\b'
      - '\bsubmissions?\s+(?:associate|specialist|coordinator|assistant|publisher)'
      - '\bregulatory\s+(?:cmc|operations|submissions?|strategy|intelligence|publishing|writ)'
  - key: medical_affairs
    label: Medical Affairs
    priority: true
    patterns:
      - 'medical\s+affairs'
      - 'medical\s+information'
      - 'medical\s+science\s+liaison'
      - '(?-i:\bMSL\b)'
      - 'medical\s+(?:excellence|evidence|education|insights?|operations|governance|graduate|associate|executive|specialist)'
      - 'field\s+medical'
      - 'scientific\s+(?:advis[oe]r|liaison)'
      - '\bmedical\s+programme'
  - key: clinical_operations
    label: Clinical Operations
    priority: true
    patterns:
      - 'clinical\s+operations?'
      - 'clinical\s+trials?'
      - 'clinical\s+research'
      - 'clinical\s+study'
      - 'clinical\s+project'
      - 'clinical\s+site'
      - '(?-i:\bCRAs?\b)'
      - '(?-i:\bCTAs?\b)'
      - 'study\s+start[- ]?up'
      - 'site\s+(?:activation|start[- ]?up|management|monitor|ready|contracts?|engagement)'
      - '\btrials?\s+(?:coordinator|administrator|assistant|associate|specialist)'
      - '\bstart[- ]?up\s+(?:specialist|associate|coordinator)'
      - 'clinical\s+development'
      - '\bmonitoring\s+associate'
      - 'patient\s+recruitment'
  - key: drug_safety
    label: Drug Safety / PV
    priority: false
    patterns:
      - 'pharmacovigilance'
      - 'drug\s+safety'
      - 'patient\s+safety'
      - '(?-i:\bPV\b)'
      - 'safety\s+(?:associate|specialist|scientist|case|officer|surveillance)'
      - 'case\s+processing'
  - key: medical_writing
    label: Medical Writing / Comms
    priority: false
    patterns:
      - 'medical\s+writ'
      - 'scientific\s+writ'
      - 'medical\s+communications?'
      - 'med\s*comms'
  - key: clinical_data
    label: Clinical Data
    priority: false
    patterns:
      - 'clinical\s+data'
      - '\bdata\s+(?:management|coordinator)\b'
      - 'clinical\s+(?:trial\s+)?supplies'

# Label used for graduate programmes that don't fit an area above.
other_graduate_label: Other Graduate Scheme

# Title words that mean a structured graduate / early-talent scheme.
scheme_patterns:
  - '\bgraduates?\b'
  - '\bgrad\b'
  - 'future\s+leaders?'
  - 'early\s+(?:talent|careers?)'
  - 'emerging\s+talent'
  - 'leadership\s+(?:development\s+)?program'
  - 'rotational'
  - 'development\s+program'
  - 'trainee\s+program'
  - 'postgraduate\s+program'

# Title words that suggest an entry-level role.
entry_patterns:
  - 'entry[- ]level'
  - '\btrainee\b'
  - '\bjunior\b'
  - '\bapprentice(?:ship)?\b'
  - '\bassistant\b'
  - '\bcoordinator\b'
  - '\badministrator\b'
  - '\bassociate\b'
  - '\bofficer\b'
  - '\btechnician\b'
  - '(?-i:(?<![A-Za-z])I(?![A-Za-z]))'
  - '\blevel\s*1\b'

# Title words that mean a role is too senior or needs a professional
# qualification. These roles are skipped (unless the title is a scheme).
senior_patterns:
  - '\bsenior\b'
  - '\bsr\b\.?'
  - '\blead\b'
  - '\bleader\b'
  - '\bprincipal\b'
  - '\bmanager\b'
  - '\bdirector\b'
  - '\bhead\b'
  - '(?-i:\bVP\b)'
  - 'vice\s+president'
  - '\bchief\b'
  - '\bexpert\b'
  - '\bconsultant\b'
  - '\bpartner\b'
  - '\bphysician\b'
  - '\bnurse\b'
  - '\bpharmacist\b'
  - '\bdoctor\b'
  - '(?-i:\bMD\b)'
  - 'post[- ]?doc'
  - '\bfellow(?:ship)?\b'
  - '\bstatistician\b'
  - 'medical\s+science\s+liaison'
  - '(?-i:\bMSL\b)'
  - 'medical\s+advis[oe]r'
  - 'medical\s+director'
  - '(?-i:\b(?:II|III|IV|V)\b)'
  - '\blevel\s*[2-9]\b'

# Titles that are never relevant for a final-year student looking for a
# graduate job (internships, placements, PhD studentships...).
exclude_patterns:
  - '\bintern(?:ship)?s?\b'
  - '\bplacement'
  - '\bsummer\b'
  - '\bco[- ]?op\b'
  - 'year\s+in\s+industry'
  - '\bundergraduate\b'
  - '\bstudent\b'
  - '\bwork\s+experience\b'
  - '\binsight\s+(?:week|day|programme|program)'
  - '\bph\.?\s?d\b'
  - '\bsandwich\s+year\b'
  - 'do\s+not\s+apply'
  - '\btest\s+req\b'

# Graduate schemes in these functions are ignored because they don't suit a
# pharmacology degree. Delete a line to start tracking that function.
exclude_functions:
  - 'engineer'
  - '(?<!pharmaceutical )\btechnology\b'
  - '\btech\b'
  - '\bdigital\b'
  - '\bsoftware\b'
  - '(?-i:\bIT\b)'
  - '\bcyber'
  - '\bdata\s+scien'
  - '\bai\b'
  - '\bfinanc'
  - '\baccount'
  - '\bprocurement\b'
  - '(?-i:\bHR\b)'
  - 'human\s+resources'
  - '\bpeople\b'
  - '\blegal\b'
  - '\btax\b'
  - '\baudit\b'
  - 'supply\s+chain'
  - '\bmanufacturing\b'
  - '\bmaintenance\b'
  - '\belectrical\b'
  - '\bmechanical\b'
  - '\bfacilities\b'
  - '\bprocess\b'
  - '\bsales\b'
  - '\blogistics\b'

# Words in a title meaning "register interest now, applications open later".
register_interest_patterns:
  - 'register\s+(?:your\s+)?interest'
  - 'expression\s+of\s+interest'
  - 'pre[- ]?regist'
  - 'talent\s+(?:pool|community|network)'

# Search terms used only for job boards that can't be filtered by country.
fallback_queries:
  - graduate
  - regulatory
  - medical affairs
  - medical information
  - clinical operations
  - clinical trial
  - clinical research
  - pharmacovigilance
  - early talent
  - entry level
