# Companies the tracker checks, and where their job boards live.
#
# Each company needs a `name`, a `type` (pharma | cro | consultancy) and at
# least one `source`. Supported source types:
#
#   workday         url: https://<tenant>.wdN.myworkdayjobs.com/<Site>
#   eightfold       url: https://talent.<company>.com   domain: <company>.com
#   jibe            url: https://careers.<company>.com
#   phenom          url: https://careers.<company>.com/<region>/<lang>
#   successfactors  url: https://jobs.<company>.com       (classic /search/ page)
#   successfactors_csb url: https://careers.<company>.com  (newer Career Site Builder)
#   radancy         url: https://jobs.<company>.com       (sites with /search-jobs)
#   icims           url: https://<name>.icims.com
#   attrax          url: https://careers.<company>.com/en/jobs
#   greenhouse      board: <board token>
#   lever           company: <lever slug>
#   smartrecruiters company: <smartrecruiters id>
#   pinpoint        url: https://<company>.pinpointhq.com
#   pagewatch       url: <careers page>   (reads job links straight off a page)
#
# `uk_only: true` means every job on that board is assumed to be in the UK
# (used for small UK-only companies whose listings don't always say where).
#
# To add a company: find its job board (open any job advert and look at the
# address bar), add an entry below, and push. The next run picks it up and
# the "Source health" table in the README shows whether it worked.

companies:
